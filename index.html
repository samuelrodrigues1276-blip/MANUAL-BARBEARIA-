<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font:14px system-ui,sans-serif}img{max-width:100%}[hidden]{display:none!important}</style></head><body>
<title>Manual Barbearia</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@500;700&family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style id="css">
/* Layout: preto e dourado da logo. Coluna única, seções separadas por régua, passos numerados porque a ordem importa. */
:root{
  --bg:#0b0b0a; --panel:#151412; --ink:#efe7d6; --muted:#a39a87; --line:#2e2a22;
  --red:#c9a45c; --blue:#e0c27d; --on-red:#141107;
  --display:"Playfair Display","Bodoni MT",Didot,Georgia,serif;
  --body:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
  color-scheme:dark;
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
@media (prefers-reduced-motion:reduce){html{scroll-behavior:auto}}
body{background:var(--bg);color:var(--ink);font:16px/1.5 var(--body);padding-inline:16px;padding-block:0 40px}
.pole{height:2px;margin-inline:-16px;background:linear-gradient(90deg,transparent,var(--red),transparent)}
.logo{display:block;width:132px;height:132px;border-radius:50%;margin-bottom:24px}
.wrap{max-width:760px;margin-inline:auto;position:relative;z-index:1}
body::before{content:"";position:fixed;inset:0;z-index:0;pointer-events:none;background:var(--logo) center 45%/min(92vw,620px) no-repeat;opacity:.08}
.kicker{font:500 12px/1.4 var(--mono);letter-spacing:.14em;text-transform:uppercase;color:var(--muted);margin:0}
h1,h2{font-family:var(--display);text-transform:uppercase;margin:0;text-wrap:balance}
h2{font-weight:700;font-size:clamp(26px,6.4vw,38px);line-height:1.1;letter-spacing:.08em;margin-block:8px 18px}
.hero{padding-block:36px 40px}
h1{font-weight:700;font-size:clamp(34px,10.5vw,76px);line-height:1.08;letter-spacing:.12em;margin-block:14px 18px}
h1 span{display:block}
.ruler{height:14px;border-bottom:1px solid var(--red);background:
  repeating-linear-gradient(90deg,var(--red) 0 1px,transparent 1px 60px) bottom/100% 14px no-repeat,
  repeating-linear-gradient(90deg,var(--red) 0 1px,transparent 1px 12px) bottom/100% 7px no-repeat}
.lead{max-width:34ch;font-size:19px;margin:20px 0 22px}
.cta-row,.actions{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.btn{display:inline-flex;align-items:center;justify-content:center;min-height:48px;padding:0 22px;border-radius:6px;font:600 16px var(--body);text-decoration:none;cursor:pointer;border:1px solid var(--ink);color:var(--ink);background:transparent}
.btn.red{background:var(--red);border-color:var(--red);color:var(--on-red)}
.btn[aria-disabled="true"],.btn:disabled{opacity:.45;pointer-events:none}
.btn:focus-visible,.chip:focus-visible,.day:focus-visible,.inp:focus-visible{outline:2px solid var(--blue);outline-offset:2px}
.sec{padding-block:36px;border-top:1px solid var(--line)}
.owner{background:var(--panel);margin-inline:-16px;padding-inline:16px;border-top:0;border-bottom:1px solid var(--line)}
.note{color:var(--muted);font-size:14px;margin:0 0 16px;max-width:60ch}
.step{display:grid;grid-template-columns:auto 1fr;gap:4px 12px;align-items:baseline;margin-block:26px 10px}
.step b{font:500 13px var(--mono);color:var(--on-red);background:var(--red);padding:1px 7px;border-radius:3px}
.step span{font:700 20px/1.1 var(--display);text-transform:uppercase;letter-spacing:.1em}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{display:inline-flex;flex-direction:column;align-items:flex-start;justify-content:center;gap:2px;min-height:48px;padding:8px 14px;border:1px solid var(--line);border-radius:6px;background:var(--panel);color:var(--ink);font:500 15px var(--mono);cursor:pointer;text-align:left}
.chip small{font:400 12px var(--mono);opacity:.75}
.chip[aria-pressed="true"]{background:var(--red);color:var(--on-red);border-color:var(--red)}
.strip{display:flex;gap:8px;overflow-x:auto;padding-bottom:10px;scrollbar-width:thin}
.day{flex:0 0 auto;display:flex;flex-direction:column;align-items:center;min-width:62px;padding:8px 6px;border:1px solid var(--line);border-radius:6px;background:var(--panel);color:var(--ink);cursor:pointer}
.day .wd,.day .mo{font:500 11px var(--mono);letter-spacing:.1em;text-transform:uppercase;color:inherit;opacity:.75}
.day .dn{font:700 28px/1.1 var(--display);font-variant-numeric:lining-nums}
.day[aria-pressed="true"]{background:var(--red);color:var(--on-red);border-color:var(--red)}
.day:disabled{opacity:.35;border-style:dashed;cursor:not-allowed}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(88px,1fr));gap:8px;margin-bottom:16px}
.grid .chip{align-items:center;font-variant-numeric:tabular-nums}
.empty{color:var(--muted);margin:0}
.inp{width:100%;min-height:48px;padding:0 14px;border:1px solid var(--line);border-radius:6px;background:var(--panel);color:var(--ink);font:16px var(--body)}
.lbl{display:block;font:500 13px var(--mono);letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin:18px 0 6px}
.owner .lbl{margin-top:22px}
.owner .actions{margin-block:12px}
.erow{display:flex;flex-wrap:wrap;gap:8px;padding-bottom:10px;margin-bottom:10px;border-bottom:1px solid var(--line)}
.erow .inp{flex:1 1 150px;min-width:0;width:auto}
.erow .inp.s{flex:0 0 96px}
.erow .btn{min-height:48px;padding:0 14px}
.otime b{font:500 15px var(--mono)}
.otime i{font:400 10px var(--mono);font-style:normal;letter-spacing:.08em;text-transform:uppercase;opacity:.8}
.otime[data-s="taken"]{background:var(--red);border-color:var(--red);color:var(--on-red)}
.otime[data-s="closed"]{border-style:dashed;color:var(--muted);background:transparent}
.otime[data-s="closed"] b{text-decoration:line-through}
.sum{font:500 14px var(--mono);margin:18px 0 12px;min-height:21px}
#go{width:100%}
.plan{display:grid;grid-template-columns:1fr auto;grid-template-areas:"name price" "inc btn";gap:6px 16px;align-items:center;padding-block:18px;border-top:1px solid var(--line)}
.plan:last-child{border-bottom:1px solid var(--line)}
.plan .pn{grid-area:name;font:700 clamp(19px,5vw,24px)/1.2 var(--display);text-transform:uppercase;letter-spacing:.08em;min-width:0}
.plan .pp{grid-area:price;font:700 clamp(21px,5.6vw,27px)/1.2 var(--display);text-align:right;font-variant-numeric:lining-nums tabular-nums;white-space:nowrap;color:var(--red)}
.plan .pp small{font:400 12px var(--mono);margin-left:4px;color:var(--muted)}
.plan .pi{grid-area:inc;font:400 13px var(--mono);color:var(--muted);min-width:0}
.plan .btn{grid-area:btn;min-height:44px;padding:0 16px}
.foot{display:flex;flex-wrap:wrap;justify-content:space-between;gap:12px;align-items:center;padding-top:28px;border-top:1px solid var(--line)}
.foot a{color:var(--ink);font-weight:600}
</style>

function pad(n){return String(n).padStart(2,'0')}
function ymd(d){return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate())}
function addDays(d,n){var x=new Date(d);x.setDate(x.getDate()+n);return x}
function parseYmd(s){var p=s.split('-').map(Number);return new Date(p[0],p[1]-1,p[2])}
function mins(t){var p=t.split(':');return +p[0]*60+ +p[1]}

function defaultOpen(dow){

}

  var open=new Set(rec?rec.open:defaultOpen(parseYmd(ds).getDay()));
  var taken=new Set(rec?rec.taken:[]);
  return GRID.map(function(t){return {t:t,s:taken.has(t)?'taken':open.has(t)?'free':'closed'}});
}
function setStatus(ds,t,s){
  if(!state.days[ds])state.days[ds]={open:defaultOpen(parseYmd(ds).getDay()),taken:[]};
  var rec=state.days[ds];
  rec.open=rec.open.filter(function(x){return x!==t});
  rec.taken=rec.taken.filter(function(x){return x!==t});
  if(s==='free')rec.open.push(t);
  if(s==='taken')rec.taken.push(t);
  rec.open.sort();rec.taken.sort();
}
function isPast(ds,t){
  if(ds<todayS)return true;
  if(ds>todayS)return false;
  return mins(t)<=now.getHours()*60+now.getMinutes()+15;
}
function freeTimes(ds){
  return dayInfo(ds).filter(function(x){return x.s==='free'&&!isPast(ds,x.t)}).map(function(x){return x.t});
}

/* ---------- DOM ---------- */
function $(s){return document.querySelector(s)}
function el(tag,attrs){
  var e=document.createElement(tag);
  for(var k in (attrs||{})){
    var v=attrs[k];
    if(v==null||v===false)continue;
    if(k==='class')e.className=v;
    else if(k.indexOf('on')===0)e.addEventListener(k.slice(2),v);
    else e.setAttribute(k,v===true?'':v);
  }
  for(var i=2;i<arguments.length;i++){
    var c=arguments[i];
    if(Array.isArray(c))c.forEach(function(x){e.append(x)});
    else if(c!=null)e.append(c);
  }
  return e;
}

/* ---------- Cliente ---------- */
var sel={svc:0,date:null,time:null};
function customerDays(){var o=[];for(var i=0;i<14;i++)o.push(ymd(addDays(today,i)));return o}
function dayStrip(box,dates,cur,pick,ok){
  box.replaceChildren.apply(box,dates.map(function(ds){
    var d=parseYmd(ds);
    return el('button',{type:'button',class:'day',disabled:!ok(ds),'aria-pressed':String(ds===cur),onclick:function(){pick(ds)}},
      el('span',{class:'wd'},WDS[d.getDay()]),el('span',{class:'dn'},String(d.getDate())),el('span',{class:'mo'},MON[d.getMonth()]));
  }));
}
function renderSvc(){
  $('#svc').replaceChildren.apply($('#svc'),SERVICES.map(function(s,i){
    return el('button',{type:'button',class:'chip','aria-pressed':String(i===sel.svc),onclick:function(){sel.svc=i;renderSvc();renderSummary()}},
      s.n,el('small',{},money(s.p)+' · '+s.m+' min'));
  }));
}
function renderDays(){
  dayStrip($('#days'),customerDays(),sel.date,function(ds){sel.date=ds;sel.time=null;renderDays();renderTimes();renderSummary()},function(ds){return freeTimes(ds).length>0});
}
function renderTimes(){
  var box=$('#times');
  var ts=sel.date?freeTimes(sel.date):[];
  if(!ts.length){box.replaceChildren(el('p',{class:'empty'},'Sem horários livres neste dia. Escolha outro dia.'));return}
  box.replaceChildren.apply(box,ts.map(function(t){
    return el('button',{type:'button',class:'chip','aria-pressed':String(t===sel.time),onclick:function(){sel.time=t;renderTimes();renderSummary()}},t);
  }));
}
function renderSummary(){
  var s=SERVICES[sel.svc],name=($('#nome').value||'').trim();
  var go=$('#go'),sum=$('#sum');
  var ready=sel.date&&sel.time&&name;
  if(sel.date&&sel.time){
    var d=parseYmd(sel.date);
    sum.textContent=s.n+' · '+WDS[d.getDay()]+', '+d.getDate()+' '+MON[d.getMonth()]+' · '+sel.time;
  }else{
    sum.textContent='Escolha o dia e o horário.';
  }
  if(ready){
    var d2=parseYmd(sel.date);
    var msg='Olá, Manual Barbearia! Sou '+name+'. Quero agendar '+s.n+' ('+money(s.p)+') para '+WDL[d2.getDay()]+', '+d2.getDate()+' de '+MON[d2.getMonth()]+', às '+sel.time+'.';
    go.setAttribute('href',waUrl(msg));go.setAttribute('target','_blank');go.setAttribute('rel','noopener');
    go.removeAttribute('aria-disabled');
  }else{
    go.removeAttribute('href');go.setAttribute('aria-disabled','true');
    if(sel.date&&sel.time&&!name)sum.textContent+=' · falta o seu nome';
  }
}
function renderPlans(){
  $('#plans').replaceChildren.apply($('#plans'),PLANS.map(function(p){
    var msg='Olá, Manual Barbearia! Quero assinar o plano '+p.n+' ('+p.d+', '+money(p.p)+' por mês).';
    return el('div',{class:'plan'},
      el('span',{class:'pn'},p.n),
      el('span',{class:'pp'},money(p.p),el('small',{},'/mês')),
      el('span',{class:'pi'},p.d),
      el('a',{class:'btn',href:waUrl(msg),target:'_blank',rel:'noopener'},'Assinar'));
  }));
  var f=$('#footwa');
  if(state.whatsapp){f.href='https://wa.me/'+state.whatsapp;f.hidden=false}else{f.hidden=true}
}
function refreshCustomer(){
  if(sel.date&&!freeTimes(sel.date).length)sel.date=customerDays().find(function(ds){return freeTimes(ds).length})||null;
  if(sel.time&&!(sel.date&&freeTimes(sel.date).indexOf(sel.time)>=0))sel.time=null;
  renderDays();renderTimes();renderSummary();renderPlans();
}
$('#nome').addEventListener('input',renderSummary);
sel.date=customerDays().find(function(ds){return freeTimes(ds).length})||null;
renderSvc();renderDays();renderTimes();renderSummary();renderPlans();

/* ---------- Barbeiro ---------- */

function markChanged(){changed=true;$('#pub').disabled=false;$('#pubmsg').textContent='Alterações ainda não publicadas.'}
function ownerDays(){var o=[];for(var i=0;i<30;i++)o.push(ymd(addDays(today,i)));return o}

    }},el('b',{},x.t),el('i',{},LABEL[x.s]));

function num(v){var n=parseFloat(String(v).replace(',','.'));return isFinite(n)&&n>=0?n:0}
function edField(label,val,cls,onin,mode){

}

function buildDoc(){
  var json=JSON.stringify(state).replace(/</g,'\\u003c');
  var end='</'+'script>';
  return '<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>'+RESET+'</style></head><body>'+
    '<title>'+TITLE+'</title>'+FONT_LINK+
    '<style id="css">'+document.getElementById('css').textContent+'</style>'+
    '<div id="app"></div>'+
    '<script id="state" type="application/json">'+json+end+
    '<script id="code">'+document.getElementById('code').textContent+end+
    '</body></html>';
}
function prune(){Object.keys(state.days).forEach(function(ds){if(ds<todayS)delete state.days[ds]})}
$('#pub').addEventListener('click',async function(){
  var btn=this,msg=$('#pubmsg');
  try{
    var art=await window.claude.use('artifact');
    if(!art)throw {code:'not_granted'};
    btn.disabled=true;msg.textContent='Publicando…';
    prune();
    await art.publish(buildDoc());
    msg.textContent='Publicado.';
  }catch(e){
    var c=e&&e.code;
    msg.textContent=c==='conflict'?'Outra versão foi publicada. A página vai recarregar.':
      (c==='not_writer'||c==='not_granted')?'Esta conta não pode publicar alterações.':'Não foi possível publicar. Tente de novo.';
    btn.disabled=false;
  }
});

(async function(){
  try{
    var c=window.claude;if(!c)return;
    var user=await c.use('user'),art=await c.use('artifact');
    if(!user||!art)return;
    if(await user.canEdit()){$('#painel').hidden=false;renderOwner();renderEditor()}
  }catch(e){}
})();
})();
